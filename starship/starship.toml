# custom format
format = """
$username$hostname$directory\
$git_branch$git_commit$git_state$git_status\
$fill \
$cmd_duration\
$line_break\
$character"""

# blank line at the start of the prompt
add_newline = true

# theme
# - https://github.com/catppuccin/starship
palette = "catppuccin_mocha"

[character]
success_symbol = "[[󰄛](green) ❯](peach)"
error_symbol = "[[󰄛](red) ❯](peach)"
vimcmd_symbol = "[󰄛 ❮](subtext1)" # for zsh-vi-mode

[directory]
truncation_length = 4
truncation_symbol = "…/"

[fill]
symbol = "·"

[git_branch]
style = "bold mauve"

[git_commit]
commit_hash_length = 8

